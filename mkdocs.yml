site_name: mojo-flatbuffers
site_description: From-scratch FlatBuffers serializer for Mojo
site_author: Leonid Ganeline
site_url: https://leo-gan.github.io/gld-flatbuffers/
repo_url: https://github.com/leo-gan/gld-flatbuffers
repo_name: leo-gan/gld-flatbuffers
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Leonid Ganeline. MIT.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leo-gan/gld-flatbuffers
      name: GitHub Repository

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why FlatBuffers: why-flatbuffers.md
  - Instructions: instructions.md
  - Examples: examples.md
  - Techniques: techniques.md
  - Test data: test-data.md
